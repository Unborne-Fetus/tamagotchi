<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#dde5c4">
  <title>Virtual Pet — P1 Research Prototype</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; background: #e9eddf; color: #233325 }
    * { box-sizing: border-box }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 1.4rem }
    main { max-width: 680px; width: 100%; display: grid; gap: 1.5rem; justify-items: center }
    h1 { font-size: 1.35rem; margin: 0; text-align: center }
    .hint { margin: 0; text-align: center; max-width: 50ch; color: #465649; font-size: .92rem }
    .shell { width: min(340px, 88vw); aspect-ratio: .82; background: #d7a7ae; border-radius: 47% 48% 46% 46% / 43% 43% 52% 52%; border: 8px solid #b9818c; box-shadow: inset -16px -15px 25px #b97e8955, inset 12px 14px 20px #fff9, 0 15px 30px #0002; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px; padding: 30px }
    .screen-border { width: 100%; aspect-ratio: 1.43; border: 5px solid #b79a93; border-radius: 18px; padding: 12px; background: #c0c9a8; box-shadow: inset 0 2px 5px #0003 }
    .indicator { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; height: 30px; align-items: center }
    .indicator span { font-size: .64rem; border-radius: 5px; padding: 2px; text-align: center; background: #e1e6d0; opacity: .56; white-space: nowrap; overflow: hidden }
    .indicator span.active { opacity: 1; background: #6c8059; color: #fff }
    .indicator span.attention { background: #4f4f27; color: #fff; opacity: 1; animation: pulse 1s infinite }
    canvas { width: 100%; height: auto; aspect-ratio: 2/1; background: #cbd8ad; image-rendering: pixelated; display: block; border: 2px solid #a3b38a }
    .controls { display: flex; gap: 26px }
    .controls button { width: 58px; height: 48px; background: #ecbdc1; border: 3px solid #925f6b; border-radius: 50%; box-shadow: 0 5px 0 #935e6a; font-weight: 800; cursor: pointer; touch-action: manipulation }
    .controls button:active { transform: translateY(4px); box-shadow: 0 1px 0 #935e6a }
    .control-legend { display: flex; gap: 38px; font-size: .75rem; color: #533d43; font-weight: 700; margin-top: -14px }
    .status { width: 100%; display: grid; gap: 7px; padding: 1rem; border: 1px solid #b7c5ae; background: #f7f9f1; border-radius: 12px }
    .status p { margin: 0 }
    .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px }
    .stat-grid span { background: #e8eedf; padding: 7px; border-radius: 6px; font-size: .88rem }
    .toolbar { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px }
    .toolbar button, .toolbar a { color: #234331; background: white; padding: 9px 12px; border: 1px solid #a7b6a0; border-radius: 8px; font: inherit; text-decoration: none; cursor: pointer }
    .small { font-size: .8rem; color: #566454 }
    @keyframes pulse { 50% { filter: brightness(1.8) } }
    @media(prefers-reduced-motion:reduce){* { animation: none !important; transition: none !important }}
  </style>
</head>
<body>
  <main>
    <h1>1996-style Virtual Pet</h1>
    <p class="hint">Research prototype — provisional mechanics and independently drawn placeholder art. Not yet an exact recreation.</p>
    <div class="shell" aria-label="Virtual pet three-button device">
      <div class="screen-border">
        <div class="indicator" id="top-icons" aria-label="Top function icons"></div>
        <canvas width="32" height="16" id="lcd" role="img" aria-label="Virtual pet monochrome LCD"></canvas>
        <div class="indicator" id="bottom-icons" aria-label="Bottom function icons"></div>
      </div>
      <div class="controls">
        <button id="button-a" aria-label="Button A, select">A</button>
        <button id="button-b" aria-label="Button B, confirm">B</button>
        <button id="button-c" aria-label="Button C, cancel">C</button>
      </div>
      <div class="control-legend"><span>SELECT</span><span>OK</span><span>BACK</span></div>
    </div>
    <section class="status" aria-live="polite">
      <p><strong id="screen-label">Clock setup</strong> · <span id="outcome">Use A / B / C</span></p>
      <div class="stat-grid" id="stats"></div>
      <p class="small" id="help"></p>
    </section>
    <div class="toolbar">
      <button id="combo" aria-label="Press buttons A and C together">A + C</button>
      <button id="export">Export save</button>
      <label for="import-save" class="small">Import save <input id="import-save" type="file" accept=".json,application/json"></label>
      <a href="./docs/P1_REFERENCE.md">Reference notes</a>
    </div>
    <p class="small">Keys A/B/C or 1/2/3. Progress uses wall time when this page is closed. Stored locally on this device.</p>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
