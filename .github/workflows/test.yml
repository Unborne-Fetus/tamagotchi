name: Prototype verification
on:
  push:
    branches: [main]
  pull_request:

jobs:
  node-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check syntax
        run: |
          node --check src/engine.js
          node --check src/main.js
      - name: Run deterministic simulation tests
        run: npm test
